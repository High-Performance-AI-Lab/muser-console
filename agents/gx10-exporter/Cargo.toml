[package]
name = "gx10-exporter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gx10_exporter"
path = "src/lib.rs"

[[bin]]
name = "gx10-exporter"
path = "src/main.rs"

[dependencies]
# Same minimal set the console server already carries. No CUDA crate and no
# Prometheus client crate: NVML is opened with dlopen at run time (see
# src/nvml.rs) and the exposition is six metric families of hand-written
# text, which is not worth a dependency.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
# The integration test speaks HTTP/1.1 down a raw socket rather than pulling
# a client into the tree; that needs tokio's io traits and nothing else.
tokio = { version = "1", features = ["io-util"] }
